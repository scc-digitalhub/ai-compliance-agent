[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compliance-adk"
version = "0.1.0"
description = "ADK agents and FastAPI service for AI compliance analysis"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.12",
    "litellm>=1.80",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "jsonschema>=4.20"]

[tool.setuptools.packages.find]
include = ["compliance_adk*"]

[tool.setuptools.package-data]
compliance_adk = ["skills/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
